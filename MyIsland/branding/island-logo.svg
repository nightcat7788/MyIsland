<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 液态玻璃主体渐变 -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C4A63"/>
      <stop offset="45%" stop-color="#282B36"/>
      <stop offset="100%" stop-color="#1A1D26"/>
    </linearGradient>
    <!-- 内部暖橙→青蓝的律动辉光 -->
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A24A"/>
      <stop offset="50%" stop-color="#5A96FF"/>
      <stop offset="100%" stop-color="#3CBE78"/>
    </linearGradient>
    <!-- 顶部高光 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5A96FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5A96FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- 外围柔光 -->
  <ellipse cx="256" cy="262" rx="196" ry="180" fill="url(#halo)" filter="url(#soft)"/>

  <!-- 岛屿主体：圆角胶囊（squircle 风格） -->
  <rect x="72" y="104" width="368" height="304" rx="132" ry="132" fill="url(#glass)"/>

  <!-- 内部律动辉光 -->
  <g filter="url(#soft2)" opacity="0.85">
    <ellipse cx="176" cy="300" rx="86" ry="70" fill="#E8A24A" opacity="0.55"/>
    <ellipse cx="322" cy="238" rx="96" ry="78" fill="#5A96FF" opacity="0.55"/>
    <ellipse cx="268" cy="316" rx="70" ry="56" fill="#3CBE78" opacity="0.35"/>
  </g>

  <!-- 玻璃内壁高光 -->
  <rect x="78" y="110" width="356" height="292" rx="127" ry="127" fill="url(#rim)"/>

  <!-- 边缘描边 -->
  <rect x="72" y="104" width="368" height="304" rx="132" ry="132"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- 4 根律动条（低/中低/中高/高 对应不同高度），呼应真实频谱 -->
  <g fill="#FFFFFF">
    <rect x="163" y="196" width="30" height="120" rx="15"/>
    <rect x="210" y="226" width="30" height="90"  rx="15"/>
    <rect x="257" y="256" width="30" height="60"  rx="15"/>
    <rect x="304" y="166" width="30" height="150" rx="15"/>
  </g>
</svg>
